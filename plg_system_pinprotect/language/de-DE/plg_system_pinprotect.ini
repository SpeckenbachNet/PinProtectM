PLG_SYSTEM_PINPROTECT="System - PinProtectM"
PLG_SYSTEM_PINPROTECT_XML_DESCRIPTION="Schützt die gesamte Website mit einem PIN-Code, mit Ausnahmen für einzelne Menüpunkte und URLs."

; Settings: basic
PLG_SYSTEM_PINPROTECT_PIN_LABEL="PIN"
PLG_SYSTEM_PINPROTECT_PIN_DESC="Der Code, den Besucher eingeben müssen. Solange das Feld leer ist, tut das Plugin nichts. Nach einer Änderung wird jeder nach der neuen PIN gefragt."
PLG_SYSTEM_PINPROTECT_ALLOWED_ITEMIDS_LABEL="Freie Menüpunkte"
PLG_SYSTEM_PINPROTECT_ALLOWED_ITEMIDS_DESC="IDs der Menüpunkte, die ohne PIN aufrufbar sind, durch Kommas getrennt, z. B. 101,105. Die IDs stehen in der Liste der Menüeinträge."
PLG_SYSTEM_PINPROTECT_ALLOWED_URLS_LABEL="Freie URLs"
PLG_SYSTEM_PINPROTECT_ALLOWED_URLS_DESC="Ein URL-Teil pro Zeile, z. B. /impressum. Jede Seite, deren Adresse einen dieser Teile enthält, ist ohne PIN aufrufbar."
PLG_SYSTEM_PINPROTECT_SKIP_LOGGED_IN_LABEL="Angemeldete Benutzer ausnehmen"
PLG_SYSTEM_PINPROTECT_SKIP_LOGGED_IN_DESC="Angemeldete Benutzer brauchen keine PIN. Damit man sich auf der Website anmelden kann, muss die Anmeldeseite als freier Menüpunkt oder freie URL eingetragen sein."

; Settings: security
PLG_SYSTEM_PINPROTECT_FIELDSET_SECURITY="Sicherheit"
PLG_SYSTEM_PINPROTECT_MAX_ATTEMPTS_LABEL="Fehlversuche"
PLG_SYSTEM_PINPROTECT_MAX_ATTEMPTS_DESC="Nach so vielen falschen PINs von einer IP-Adresse wird die Eingabe für eine Weile gesperrt. 0 schaltet die Sperre ab."
PLG_SYSTEM_PINPROTECT_LOCKOUT_MINUTES_LABEL="Sperre (Minuten)"
PLG_SYSTEM_PINPROTECT_LOCKOUT_MINUTES_DESC="So lange bleibt die PIN-Eingabe gesperrt. Besucher mit derselben IP-Adresse (Büro, Haushalt) teilen sich die Sperre."

; Settings: page
PLG_SYSTEM_PINPROTECT_FIELDSET_PAGE="PIN-Seite"
PLG_SYSTEM_PINPROTECT_HEADER_LABEL="Kopfbereich"
PLG_SYSTEM_PINPROTECT_HEADER_DESC="Inhalt über der PIN-Box, z. B. ein Logo oder ein Begrüßungstext."
PLG_SYSTEM_PINPROTECT_FOOTER_LABEL="Fußbereich"
PLG_SYSTEM_PINPROTECT_FOOTER_DESC="Inhalt unter der PIN-Box, z. B. Links zu Impressum und Datenschutz (diese auch bei den freien URLs eintragen)."
PLG_SYSTEM_PINPROTECT_STYLESHEET_LABEL="Stylesheet"
PLG_SYSTEM_PINPROTECT_STYLESHEET_DESC="Optional: ein Stylesheet für die PIN-Seite, relativ zum Website-Stammverzeichnis oder als vollständige URL, z. B. die user.css des Templates."
PLG_SYSTEM_PINPROTECT_CUSTOM_CSS_LABEL="Eigenes CSS"
PLG_SYSTEM_PINPROTECT_CUSTOM_CSS_DESC="Zusätzliche Styles für die PIN-Seite. Klassen: .pinprotect, .pinprotect-header, .pinprotect-box, .pinprotect-error, .pinprotect-input, .pinprotect-button, .pinprotect-footer, .pinprotect-notice."

; Settings: notice
PLG_SYSTEM_PINPROTECT_FIELDSET_NOTICE="Datenschutzhinweis"
PLG_SYSTEM_PINPROTECT_PRIVACY_NOTICE_LABEL="Hinweis anzeigen"
PLG_SYSTEM_PINPROTECT_PRIVACY_NOTICE_DESC="Eine Leiste unten auf der PIN-Seite erklärt das Sitzungs-Cookie. Besucher schließen sie mit einem Klick, der Browser merkt sich das."
PLG_SYSTEM_PINPROTECT_PRIVACY_URL_LABEL="Datenschutzerklärung"
PLG_SYSTEM_PINPROTECT_PRIVACY_URL_DESC="Adresse der Datenschutzerklärung, z. B. /datenschutz. Leer: kein Link. Die Seite bei den freien URLs eintragen, sonst fragt auch sie nach der PIN."

; Backend
PLG_SYSTEM_PINPROTECT_WARNING_NO_PIN="PinProtectM ist aktiviert, aber es ist keine PIN gesetzt. Die Website ist nicht geschützt."

; PIN page
PLG_SYSTEM_PINPROTECT_PAGE_TITLE="Geschützter Zugang"
PLG_SYSTEM_PINPROTECT_FORM_HEADING="Bitte PIN eingeben"
PLG_SYSTEM_PINPROTECT_FORM_PLACEHOLDER="PIN"
PLG_SYSTEM_PINPROTECT_FORM_SUBMIT="Senden"
PLG_SYSTEM_PINPROTECT_ERROR_WRONG="Falsche PIN. Bitte erneut versuchen."
PLG_SYSTEM_PINPROTECT_ERROR_LOCKED="Zu viele Fehlversuche. Bitte in %d Minute(n) erneut versuchen."
PLG_SYSTEM_PINPROTECT_ERROR_TOKEN="Die Sitzung ist abgelaufen. Bitte die PIN erneut eingeben."
PLG_SYSTEM_PINPROTECT_NOTICE_TEXT="Für die PIN-Eingabe wird ein technisch notwendiges Sitzungs-Cookie gespeichert."
PLG_SYSTEM_PINPROTECT_NOTICE_LINK="Datenschutzerklärung"
PLG_SYSTEM_PINPROTECT_NOTICE_OK="Verstanden"
