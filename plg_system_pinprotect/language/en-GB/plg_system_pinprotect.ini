PLG_SYSTEM_PINPROTECT="System - PinProtectM"
PLG_SYSTEM_PINPROTECT_XML_DESCRIPTION="Protects the entire website with a PIN code, with exceptions for selected menu items and URLs."

; Settings: basic
PLG_SYSTEM_PINPROTECT_PIN_LABEL="PIN"
PLG_SYSTEM_PINPROTECT_PIN_DESC="The code visitors have to enter. As long as it is empty, the plugin does nothing. Changing it asks everyone for the new PIN."
PLG_SYSTEM_PINPROTECT_ALLOWED_ITEMIDS_LABEL="Allowed Menu Items"
PLG_SYSTEM_PINPROTECT_ALLOWED_ITEMIDS_DESC="IDs of menu items that open without a PIN, separated by commas, e.g. 101,105. The IDs are shown in the list of menu items."
PLG_SYSTEM_PINPROTECT_ALLOWED_URLS_LABEL="Allowed URLs"
PLG_SYSTEM_PINPROTECT_ALLOWED_URLS_DESC="One path per line, e.g. /contact. Only the path counts (no ?query): /contact also opens /en/contact and /contact/page-2, but not /contact-old. Imprint and privacy policy (tab Legal Links) are allowed automatically."
PLG_SYSTEM_PINPROTECT_SKIP_LOGGED_IN_LABEL="Skip Logged-in Users"
PLG_SYSTEM_PINPROTECT_SKIP_LOGGED_IN_DESC="Logged-in users don't need the PIN. To log in on the website, the login page has to be an allowed menu item or URL."

; Settings: security
PLG_SYSTEM_PINPROTECT_FIELDSET_SECURITY="Security"
PLG_SYSTEM_PINPROTECT_MAX_ATTEMPTS_LABEL="Wrong Attempts"
PLG_SYSTEM_PINPROTECT_MAX_ATTEMPTS_DESC="After this many wrong PINs from one IP address, entering a PIN is locked for a while. 0 switches the lock off."
PLG_SYSTEM_PINPROTECT_LOCKOUT_MINUTES_LABEL="Lock (Minutes)"
PLG_SYSTEM_PINPROTECT_LOCKOUT_MINUTES_DESC="How long entering a PIN stays locked. Visitors sharing one IP address (office, household) share the lock."

; Settings: page
PLG_SYSTEM_PINPROTECT_FIELDSET_PAGE="PIN Page"
PLG_SYSTEM_PINPROTECT_HEADER_LABEL="Header"
PLG_SYSTEM_PINPROTECT_HEADER_DESC="Content above the PIN box, e.g. a logo or a welcome text."
PLG_SYSTEM_PINPROTECT_FOOTER_LABEL="Footer"
PLG_SYSTEM_PINPROTECT_FOOTER_DESC="Content below the PIN box. Pages linked here have to be allowed menu items or URLs, otherwise they ask for the PIN too."
PLG_SYSTEM_PINPROTECT_STYLESHEET_LABEL="Stylesheet"
PLG_SYSTEM_PINPROTECT_STYLESHEET_DESC="Optional: a stylesheet for the PIN page, relative to the site root or as a full URL, e.g. the user.css of your template. Loaded after the built-in styles, so it overrides them."
PLG_SYSTEM_PINPROTECT_CUSTOM_CSS_LABEL="Custom CSS"
PLG_SYSTEM_PINPROTECT_CUSTOM_CSS_DESC="Additional styles for the PIN page, loaded last: they override the built-in styles and the stylesheet. Classes: .pinprotect, .pinprotect-header, .pinprotect-box, .pinprotect-error, .pinprotect-input, .pinprotect-button, .pinprotect-links, .pinprotect-footer, .pinprotect-notice."

; Settings: legal links
PLG_SYSTEM_PINPROTECT_FIELDSET_LEGAL="Legal Links"
PLG_SYSTEM_PINPROTECT_IMPRINT_URL_LABEL="Imprint"
PLG_SYSTEM_PINPROTECT_IMPRINT_URL_DESC="Address of your imprint, e.g. /imprint. Shown as a link below the PIN box and opens without a PIN. Empty: no link."
PLG_SYSTEM_PINPROTECT_IMPRINT_URL_HINT="/imprint"
PLG_SYSTEM_PINPROTECT_PRIVACY_URL_LABEL="Privacy Policy"
PLG_SYSTEM_PINPROTECT_PRIVACY_URL_HINT="/privacy"
PLG_SYSTEM_PINPROTECT_PRIVACY_URL_DESC="Address of your privacy policy, e.g. /privacy. Shown as a link below the PIN box and in the privacy notice, and opens without a PIN. Empty: no link."
PLG_SYSTEM_PINPROTECT_PRIVACY_NOTICE_LABEL="Privacy Notice"
PLG_SYSTEM_PINPROTECT_PRIVACY_NOTICE_DESC="A bar at the bottom of the PIN page explains the session cookie. Visitors close it with a click; the browser remembers that."

; Backend
PLG_SYSTEM_PINPROTECT_WARNING_NO_PIN="PinProtectM is enabled, but no PIN is set. The website is not protected."

; PIN page
PLG_SYSTEM_PINPROTECT_PAGE_TITLE="Protected Access"
PLG_SYSTEM_PINPROTECT_FORM_HEADING="Please enter the PIN"
PLG_SYSTEM_PINPROTECT_FORM_PLACEHOLDER="PIN"
PLG_SYSTEM_PINPROTECT_FORM_SUBMIT="Send"
PLG_SYSTEM_PINPROTECT_ERROR_WRONG="Wrong PIN. Please try again."
PLG_SYSTEM_PINPROTECT_ERROR_LOCKED="Too many wrong attempts. Please try again in %d minute(s)."
PLG_SYSTEM_PINPROTECT_ERROR_TOKEN="Your session has expired. Please enter the PIN again."
PLG_SYSTEM_PINPROTECT_NOTICE_TEXT="To use the PIN entry, a technically necessary session cookie is stored."
PLG_SYSTEM_PINPROTECT_NOTICE_LINK="Privacy policy"
PLG_SYSTEM_PINPROTECT_NOTICE_OK="Got it"
PLG_SYSTEM_PINPROTECT_LINK_IMPRINT="Imprint"
PLG_SYSTEM_PINPROTECT_LINK_PRIVACY="Privacy policy"
